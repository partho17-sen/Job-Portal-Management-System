<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Form</title>

    <link rel="stylesheet" href="form.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Job Application Form</h1>

        <p>Please fill up the form carefully.</p>

        <form>

            <div class="input-group">

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>

            </div>

            <div class="input-group">

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>

            </div>

            <div class="input-group">

                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>

            </div>

            <div class="input-group">

                <label>Date of Birth</label>
                <input type="date">

            </div>

            <div class="input-group">

                <label>Gender</label>

                <select>

                    <option>Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Others</option>

                </select>

            </div>

            <div class="input-group">

                <label>Address</label>

                <textarea placeholder="Enter your address"></textarea>

            </div>

            <div class="input-group">

                <label>Qualification</label>

                <input type="text" placeholder="BSc / MSc / Diploma">

            </div>

            <div class="input-group">

                <label>Skills</label>

                <input type="text" placeholder="HTML, CSS, Java, C++, Python">

            </div>

            <div class="input-group">

                <label>Experience</label>

                <input type="text" placeholder="Fresher / 1 Year / 2 Years">

            </div>

            <div class="input-group">

                <label>Expected Salary</label>

                <input type="number" placeholder="Expected Salary">

            </div>

            <div class="input-group">

                <label>Upload Resume</label>

                <input type="file">

            </div>

            <div class="input-group">

                <label>Cover Letter</label>

                <textarea placeholder="Write a short cover letter..."></textarea>

            </div>

            <button type="submit">Submit Application</button>

        </form>

        <a href="index.html" class="back-btn">⬅ Back to Home</a>

    </div>

</div>

</body>

</html>
